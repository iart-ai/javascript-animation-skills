<!doctype html><html><head><meta charset="utf-8"><title>I only asked you to fix one line (style B)</title>
<style>html,body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{width:min(100vw,100vh);height:min(100vw,100vh)}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas><script>
const W = 1080, H = 1080, FPS = 30, DUR = 30, FRAMES = FPS * DUR;
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
const PAPER = '#f4efe6', INK = '#20283f', RED = '#ff4d5e', BLUE = '#4f7cff', YELLOW = '#f5b700', SHADOW = 'rgba(20,24,40,0.18)';
// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const back = t => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));

function hash2(a, b) {
  let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- hand-drawn primitives ----------
let BOIL = 0;          // changes every 4 frames -> "line boil"
let SHADOWING = false; // when true, primitives paint the drop shadow color

function jit(x, y, seed, amp) {
  const s = seed * 13.37;
  return [
    x + (vnoise(x * .012 + s, y * .012) - .5) * 2 * amp + (vnoise(x * .09 + s, y * .09 + 7) - .5) * amp * .6,
    y + (vnoise(x * .012, y * .012 + s + 50) - .5) * 2 * amp + (vnoise(x * .09 + 3, y * .09 + s) - .5) * amp * .6,
  ];
}
function resample(pts, step = 9, closed = false) {
  const out = [], P = closed ? [...pts, pts[0]] : pts;
  for (let i = 0; i < P.length - 1; i++) {
    const [x0, y0] = P[i], [x1, y1] = P[i + 1], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let k = 0; k < n; k++) out.push([lerp(x0, x1, k / n), lerp(y0, y1, k / n)]);
  }
  if (!closed) out.push(P[P.length - 1]);
  return out;
}
function tracePath(pts, closed) {
  ctx.beginPath();
  if (pts.length < 3) { ctx.moveTo(...pts[0]); pts.slice(1).forEach(p => ctx.lineTo(...p)); if (closed) ctx.closePath(); return; }
  const P = closed ? [...pts, pts[0], pts[1]] : pts;
  ctx.moveTo(...(closed ? [(P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2] : P[0]));
  for (let i = 1; i < P.length - 1; i++) ctx.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
  if (!closed) ctx.lineTo(...P[P.length - 1]); else ctx.closePath();
}
const J = (pts, seed, amp) => pts.map(([x, y]) => jit(x, y, BOIL + seed, amp));

function ink(pts, o = {}) {
  const { w = 4, col = INK, closed = false, amp = 2, seed = 0, passes = 2, alpha = 1 } = o;
  ctx.save(); ctx.lineCap = ctx.lineJoin = 'round';
  for (let p = 0; p < passes; p++) {
    ctx.globalAlpha = alpha * (p ? .45 : 1);
    ctx.strokeStyle = SHADOWING ? SHADOW : col;
    ctx.lineWidth = w * (p ? .55 : 1);
    tracePath(J(pts, seed + p * .41, amp * (p ? 1.4 : 1)), closed);
    ctx.stroke();
  }
  ctx.restore();
}
function fill(pts, col, o = {}) {
  const { amp = 1.6, seed = 0, alpha = 1 } = o;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = SHADOWING ? SHADOW : col;
  tracePath(J(pts, seed + .2, amp), true); ctx.fill(); ctx.restore();
}
function hatch(pts, o = {}) {
  if (SHADOWING) return;
  const { angle = -0.9, gap = 11, col = INK, w = 1.6, alpha = .35, seed = 0 } = o;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const R = Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2 + 10;
  ctx.save(); tracePath(J(pts, seed, 1.5), true); ctx.clip();
  ctx.translate(cx, cy); ctx.rotate(angle);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.globalAlpha = alpha; ctx.lineCap = 'round';
  for (let y = -R, i = 0; y < R; y += gap, i++) {
    const a = hash2(i, BOIL + seed * 7) * 4 - 2, b = hash2(i + 99, BOIL + seed * 7) * 4 - 2;
    ctx.beginPath(); ctx.moveTo(-R, y + a); ctx.quadraticCurveTo(0, y + (a + b), R, y + b); ctx.stroke();
  }
  ctx.restore();
}
function withShadow(fn, dx = 9, dy = 9) {
  ctx.save(); ctx.translate(dx, dy); SHADOWING = true; fn(); SHADOWING = false; ctx.restore(); fn();
}

// shapes
const circle = (cx, cy, r, ry = r, rot = 0) => {
  const n = Math.max(20, Math.round(Math.max(r, ry) * .45)), out = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, x = Math.cos(a) * r, y = Math.sin(a) * ry;
    out.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); }
  return out;
};
const rect = (x, y, w, h) => resample([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], 12, true);
const line = (x0, y0, x1, y1) => resample([[x0, y0], [x1, y1]], 10);
const arc = (cx, cy, r, a0, a1, ry = r) => { const n = Math.max(8, Math.round(Math.abs(a1 - a0) * r / 9)), o = [];
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * ry]); } return o; };
const roundRect = (x, y, w, h, r) => resample([
  ...arc(x + w - r, y + r, r, -Math.PI / 2, 0), ...arc(x + w - r, y + h - r, r, 0, Math.PI / 2),
  ...arc(x + r, y + h - r, r, Math.PI / 2, Math.PI), ...arc(x + r, y + r, r, Math.PI, Math.PI * 1.5)], 10, true);

// labels: paper-tape tags, typed on
const FONT = '700 {s}px -apple-system, "Helvetica Neue", Arial, sans-serif';
function label(text, x, y, o = {}) {
  const { size = 40, bg = BLUE, fg = PAPER, p = 1, align = 'left', rot = -0.015, seed = 3 } = o;
  if (p <= 0) return;
  ctx.save(); ctx.font = FONT.replace('{s}', size);
  const n = Math.round(text.length * clamp((p - .1) / .9)), shown = text.slice(0, n);
  const full = ctx.measureText(text).width, padX = size * .45, h = size * 1.45;
  const w = Math.max(size, ctx.measureText(shown).width) + padX * 2;
  const x0 = align === 'center' ? x - (full + padX * 2) / 2 : align === 'right' ? x - w : x;
  ctx.translate(x0 + w / 2, y); ctx.rotate(rot); ctx.translate(-(x0 + w / 2), -y);
  const sc = easeOut(p * 3);
  ctx.translate(x0, y); ctx.scale(1, sc); ctx.translate(-x0, -y);
  const box = rect(x0, y - h / 2, w, h);
  withShadow(() => fill(box, bg, { seed }), 6, 6);
  ctx.fillStyle = fg; ctx.textBaseline = 'middle';
  ctx.fillText(shown, x0 + padX, y + 1);
  ctx.restore();
}
function note(text, x, y, o = {}) { // plain handwritten-ish ink text
  const { size = 26, col = INK, align = 'center', alpha = 1 } = o;
  ctx.save(); ctx.globalAlpha = alpha; ctx.font = FONT.replace('{s}', size); ctx.fillStyle = col;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y); ctx.restore();
}


// reveal a stroke progressively (0..1): hand-drawing a line onto the page
function drawOn(pts, p, o = {}) {
  const n = Math.max(2, Math.round(pts.length * clamp(p)));
  if (p > 0) ink(pts.slice(0, n), o);
}

// ---------- illustration primitives (a second look; use these OR the ink ones, per concept) ----------
// Picture-book shapes: outline in a darker tint of the fill (not black), inner shade, brush texture.
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const tint = (h, k) => `rgb(${rgbOf(h).map(v => Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1))).join(',')})`; // k<1 darker, k>1 toward white
const bbox = pts => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; };
function shape(pts, col, o = {}) {
  const { line = tint(col, .6), lw = 3.5, seed = 0, tex = true, shade = true, shadow = false, alpha = 1 } = o;
  if (shadow) { ctx.save(); ctx.translate(8, 10); fill(pts, 'rgba(90,60,40,.12)', { seed, amp: 1 }); ctx.restore(); }
  fill(pts, col, { seed, amp: 1, alpha });
  if (tex || shade) {
    const [x0, y0, x1, y1] = bbox(pts), bw = x1 - x0, bh = y1 - y0;
    ctx.save(); tracePath(J(pts, seed + .2, 1), true); ctx.clip(); ctx.globalAlpha = alpha;
    if (shade) { // darker rim toward bottom-right: fill dark, then the shape again nudged up-left
      ctx.fillStyle = tint(col, .8); ctx.fillRect(x0 - 5, y0 - 5, bw + 10, bh + 10);
      ctx.translate(-bw * .07, -bh * .09); fill(pts, col, { seed, amp: 1 }); ctx.translate(bw * .07, bh * .09);
    }
    if (tex) { // a few translucent lighter brush strokes
      const r = rng((Math.abs(seed * 97) | 0) + 1); ctx.lineCap = 'round'; ctx.strokeStyle = tint(col, 1.35);
      for (let i = 0; i < 10; i++) { ctx.globalAlpha = .1 + r() * .1; ctx.lineWidth = 6 + r() * 10; const y = y0 + r() * bh, x = x0 + r() * bw * .5;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + bw * (.2 + r() * .4), y - bh * .1 * r()); ctx.stroke(); }
    }
    ctx.restore();
  }
  if (lw) ink(pts, { closed: true, w: lw, col: line, seed, amp: 1, passes: 1, alpha });
}
function blush(x, y, rx, ry, a = .5) { // soft radial cheek / glow
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx); // gradient is built in the transformed space
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(236,130,115,${a})`); g.addColorStop(1, 'rgba(236,130,115,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill(); ctx.restore();
}

// ---------- paper ----------
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
(() => {
  const p = paper.getContext('2d'), r = rng(7);
  p.fillStyle = PAPER; p.fillRect(0, 0, W, H);
  for (let i = 0; i < 90000; i++) { p.fillStyle = r() < .5 ? 'rgba(90,70,50,0.05)' : 'rgba(255,255,255,0.08)';
    p.fillRect(r() * W, r() * H, 1 + r() * 1.5, 1 + r() * 1.5); }
  p.strokeStyle = 'rgba(120,95,70,0.06)'; p.lineWidth = 1;
  for (let i = 0; i < 260; i++) { const x = r() * W, y = r() * H, a = r() * 6.28, l = 6 + r() * 22;
    p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a) * l / 2 + 3, y + Math.sin(a) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke(); }
  const g = p.createRadialGradient(W / 2, H / 2, W * .35, W / 2, H / 2, W * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(60,40,20,0.13)'); p.fillStyle = g; p.fillRect(0, 0, W, H);
})();

// offscreen layer for filtered (blurred / desaturated) drawing
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
function drawLayer(fn, filter, clip) {
  const main = ctx, l = layer.getContext('2d');
  l.clearRect(0, 0, W, H); ctx = l; fn(); ctx = main;
  ctx.save(); if (clip) { ctx.beginPath(); ctx.rect(...clip); ctx.clip(); }
  ctx.filter = filter || 'none'; ctx.drawImage(layer, 0, 0); ctx.restore();
}

// ================= "I only asked you to fix one line" =================
// One world, many cameras: the room is one space; its monitor shows the code-city world.
// Every time below is on the 120 bpm beat grid (b(n) = n beats).
const BPM = 120, BEAT = 60 / BPM, b = n => n * BEAT;

const C = {
  nightTop: '#1b2140', nightHz: '#3d4272', dawnTop: '#7fa6d8', dawnHz: '#f6a878', dayTop: '#9fd0f0', dayHz: '#eaf4f8',
  brick: '#c9744f', wall: '#e8c9a0', wallNew: '#f3d9ae', roofOld: '#7b5a4a', roofNew: '#d0503f',
  bot: '#f3f5fa', botFace: '#20283f', botEye: '#63e6ff', hat: '#f5b700',
  skin: '#f1cfb6', hair: '#2b2320', hoodie: '#5f8f8b', lit: '#ffd36e', glassDay: '#cfe6f5',
};
const mix = (a, c, t) => { const A = rgbOf(a), B = rgbOf(c); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t))).toString(16).padStart(2, '0')).join(''); };

// time of day, shared by the world's sky and the room's window (continuity)
const dawn = t => ease(prog(t, b(48), b(52)));       // 24s -> 26s
const skyTop = t => mix(mix(C.nightTop, C.dawnTop, dawn(t)), C.dayTop, prog(t, 26, 27.5));
const skyHz = t => mix(mix(C.nightHz, C.dawnHz, dawn(t)), C.dayHz, prog(t, 26, 27.5));
const lightsOn = (t, i = 0) => t < 25.2 + (i % 7) * .12;

// ---------- shapes that keep a constant on-screen line width under any zoom ----------
let PX = 1; // world units per screen pixel (1 / camera zoom)
function wpoly(pts, col, o = {}) {
  const { line = tint(col, .62), lw = 2.6, seed = 0, shade = true, alpha = 1 } = o;
  fill(pts, col, { seed, amp: .8 * PX, alpha });
  if (shade) {
    const [x0, y0, x1, y1] = bbox(pts), bw = x1 - x0, bh = y1 - y0;
    ctx.save(); ctx.globalAlpha = alpha; tracePath(pts, true); ctx.clip();
    ctx.fillStyle = tint(col, .82); ctx.fillRect(x0 - 1, y0 - 1, bw + 2, bh + 2);
    ctx.translate(-bw * .06, -bh * .08); tracePath(pts, true); ctx.fillStyle = col; ctx.fill(); ctx.restore();
  }
  if (lw) ink(pts, { closed: true, w: lw * PX, col: line, seed, amp: .8 * PX, passes: 1, alpha });
}
const box = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const boxR = (x, y, w, h) => resample(box(x, y, w, h), Math.max(6, Math.min(w, h) / 3), true);
function popScale(t, t0, dur = .35) { return t < t0 ? 0 : back(prog(t, t0, t0 + dur)); }
function withPop(t, t0, ax, ay, fn, dur) { const s = popScale(t, t0, dur); if (s <= 0) return; ctx.save(); ctx.translate(ax, ay); ctx.scale(s, s); ctx.translate(-ax, -ay); fn(); ctx.restore(); }

// ---------- the agent: a little propeller-head robot ----------
// mood: happy | focus | wow | frantic | proud
function bot(x, y, s, t, o = {}) {
  const { mood = 'focus', arm = 0, tool = null, hat = false, look = 0 } = o;
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 40, s / 40); const pxs = PX; PX = PX * 40 / s;
  // propeller
  ink([[0, -30], [0, -42]], { w: 3 * PX, col: '#9aa3b8', passes: 1, amp: .3 * PX });
  const spin = Math.cos(t * 45);
  ctx.save(); ctx.fillStyle = '#ff7a59'; ctx.beginPath(); ctx.ellipse(0, -43, 16 * Math.abs(spin) + 2, 3.2, 0, 0, 7); ctx.fill(); ctx.restore();
  // arms
  const ang = -.4 - arm * 1.6;
  for (const d of [-1, 1]) { const a = d < 0 ? ang : .5 + Math.sin(t * 6) * .1, hx = d * 24 + Math.cos(Math.PI / 2 + d * a) * 0, ex = d * 22, ey = -2;
    const tx = ex + d * Math.cos(d < 0 ? a : a) * 16, ty = ey + Math.sin(d < 0 ? a : a) * 16 * (d < 0 ? 1 : 1);
    ink([[ex, ey], [tx, ty]], { w: 5 * PX, col: '#9aa3b8', passes: 1, amp: .3 * PX });
    if (d < 0 && tool === 'hammer') { ctx.save(); ctx.translate(tx, ty); ctx.rotate(a - Math.PI / 2);
      wpoly(boxR(-2, -2, 4, 20), '#8a5a3c', { seed: 900, shade: false, lw: 1.8 }); wpoly(boxR(-9, 16, 18, 9), '#7d8597', { seed: 901, lw: 1.8 }); ctx.restore(); }
    if (d < 0 && tool === 'roller') { ctx.save(); ctx.translate(tx, ty); ctx.rotate(a - Math.PI / 2);
      wpoly(boxR(-1.5, -2, 3, 18), '#8a8f9c', { seed: 902, shade: false, lw: 1.6 }); wpoly(boxR(-10, 15, 20, 8), C.wallNew, { seed: 903, lw: 1.8 }); ctx.restore(); }
  }
  // body + face screen
  wpoly(resample([[-20, -28], [20, -28], [22, 18], [-22, 18]], 5, true), C.bot, { seed: 904, line: '#9aa3b8' });
  wpoly(boxR(-15, -22, 30, 22), C.botFace, { seed: 905, shade: false, lw: 1.5, line: '#0f1424' });
  ctx.save(); ctx.strokeStyle = C.botEye; ctx.fillStyle = C.botEye; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  const ex = look * 2.5;
  for (const d of [-1, 1]) { const cx = d * 6 + ex, cy = -11;
    if (mood === 'happy' || mood === 'proud') { ctx.beginPath(); ctx.arc(cx, cy + 1.5, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else if (mood === 'wow') { ctx.beginPath(); ctx.arc(cx, cy, 3.6, 0, 7); ctx.stroke(); }
    else if (mood === 'frantic') { ctx.beginPath(); ctx.moveTo(cx - 3, cy - 3); ctx.lineTo(cx + 3, cy + 3); ctx.moveTo(cx + 3, cy - 3); ctx.lineTo(cx - 3, cy + 3); ctx.stroke(); }
    else { ctx.beginPath(); ctx.ellipse(cx, cy, 2.2, 3.2, 0, 0, 7); ctx.fill(); } }
  ctx.restore();
  // wheels-feet
  for (const d of [-1, 1]) wpoly(circle(d * 12, 21, 6), '#5b6378', { seed: 906 + d, shade: false, lw: 1.6 });
  if (hat) { wpoly(resample([[-20, -28], ...arc(0, -28, 20, Math.PI, Math.PI * 2, 16).slice(1), [24, -27], [-24, -27]], 4, true), C.hat, { seed: 908, line: '#b98500' }); }
  PX = pxs; ctx.restore();
}

// ---------- world content ----------
const TYPO = { x: -42, y: -60, w: 24, h: 10 };                     // the one brick the user asked about
// the chain reaction: each hammer blow knocks the next brick loose. [row, col, slips at, fixed at]
const CROOKED = [[7, 2, b(16.5), b(18)], [6, 3, b(18) + .06, b(19)], [5, 4, b(19) + .06, Infinity]];
const brickPos = ([r, c]) => ({ x: -90 + c * 24 + (r % 2 ? 12 : 0) + 12, y: -120 + r * 10 + 5 });
const HOUSES = [[230, b(24), '#bfd7c9', '#4f7d6a'], [-230, b(25), '#e7c1c9', '#9c4d63'], [460, b(26), '#c9d3ea', '#4b5d93'], [-460, b(27), '#f0dfb0', '#b0773c']];
const LIGHTS = [-750, -450, -150, 150, 450, 750].map((x, i) => [x, b(33) + i * BEAT / 2]);
const TREES = [-600, -300, 300, 600, -900, 900].map((x, i) => [x, b(34) + i * BEAT / 4]);
const TOWERS = [[-300, 520, 150], [380, 640, 170], [-700, 480, 180], [820, 720, 160], [-1100, 560, 200], [1150, 600, 190], [-520, 820, 150], [600, 760, 170], [-900, 680, 160], [1000, 900, 180], [150, 1300, 170]]
  .map(([x, h, w], i) => ({ x, h, w, t0: b(36 + i), col: ['#5d6d8f', '#7b8db0', '#4a5878', '#6d7fa3'][i % 4] }));
const TALL = TOWERS[TOWERS.length - 1];
const CRANE = { x: 650, t0: b(30) };

function brickWall(t) {
  const x0 = -90, y0 = -120, bw = 24, bh = 10;
  const paint = prog(t, b(20), b(22));                               // repaint sweeps left -> right on beats 20-22
  wpoly(boxR(x0, y0, 180, 120), C.wall, { seed: 20 });
  ctx.save(); tracePath(box(x0, y0, 180 * paint, 120), true); ctx.clip(); ctx.fillStyle = C.wallNew; ctx.fillRect(x0, y0, 180, 120); ctx.restore();
  for (let r = 0; r < 12; r++) for (let c = -1; c < 8; c++) {
    const x = x0 + c * bw + (r % 2 ? bw / 2 : 0), y = y0 + r * bh;
    if (x < x0 - 1 || x + bw > x0 + 181) continue;
    let rot = 0, hot = false;

    if (cr) rot = t < cr[3] ? .14 : .14 * (1 - back(prog(t, cr[3], cr[3] + .2)));

const SECTIONS = [ // [fromBar, toBar, layers]
  [0, 1, ['pad']], [1, 2, ['pad', 'hat8']], [2, 3, ['pad', 'hat8', 'kick2']], [3, 4, ['pad', 'hat8', 'kick2', 'bassHalf']], [4, 6, ['pad', 'kick4', 'hat8', 'bassHalf']],
  [6, 9, ['pad', 'kick4', 'hat8', 'clap', 'bass8']], [9, 12, ['pad', 'kick4', 'hat16', 'clap', 'bass8', 'lead']],
  [12, 13, []],                                   // the break: silence while the sun comes up
  [13, 14, ['padSoft', 'pluck']], [14, 15, ['padSoft']],
];
const SFX = [
  ...Array.from({ length: 10 }, (_, i) => [.5 + i * .25, 'click']), [b(6), 'clack'], [b(7), 'switch'],
  [b(8), 'whooshIn'], [b(10), 'boing'], [b(12), 'clank'], [b(13), 'clank'], [b(14), 'clank'], [b(15), 'ding'],
  [b(16.5), 'tick'], [b(18), 'pop'], [b(18) + .06, 'tick'], [b(19), 'pop'], [b(19) + .06, 'tick'], [b(20), 'swish'], [b(21), 'swish'], [b(22), 'thud'],
  ...HOUSES.map(([, t0], i) => [t0, 'popLow', i]), [b(28), 'clonk'], [b(30), 'creak'], [b(32), 'whoosh'],
  ...LIGHTS.map(([, t0], i) => [t0, 'blip', i]), ...TOWERS.map((T, i) => [T.t0, 'zip', i]), [b(47), 'flag'],
  [b(50), 'alarm'], [b(51), 'alarm'], [b(52), 'whooshOut'], [b(53), 'creak'], [b(54.5), 'step'], [b(55), 'step'], [b(55.5), 'step'],
  [b(56), 'notify'], [b(58), 'drip'],
];

function buildGroove(ac, { dur }) {
  const T0 = ac.currentTime + (ac instanceof OfflineAudioContext ? 0 : .05);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const out = ac.createDynamicsCompressor(); out.threshold.value = -12; out.ratio.value = 3; out.connect(ac.destination);
  const master = ac.createGain(); master.gain.value = .9; master.connect(out);
  const musicBus = ac.createGain(), sfxBus = ac.createGain(); musicBus.connect(master); sfxBus.connect(master); sfxBus.gain.value = .9;
  const rev = ac.createConvolver(), wet = ac.createGain(); wet.gain.value = .22; rev.connect(wet); wet.connect(master);
  { const n = Math.round(ac.sampleRate * 1.6), ir = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let s = 99 + c; for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = (s / 0x7fffffff * 2 - 1) * Math.pow(1 - i / n, 3); } } rev.buffer = ir; }
  musicBus.connect(rev); sfxBus.connect(rev);
  const noise = (() => { const n = ac.sampleRate, buf = ac.createBuffer(1, n, n); const d = buf.getChannelData(0); let s = 7; for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x7fffffff * 2 - 1; } return buf; })();
  // building blocks
  function env(g, t, a, peak, decay) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0, t + a, decay); }
  function osc(bus, t, type, f, peak, a, decay, f2, glide = .05, pan = 0) {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + glide); p.pan.value = pan; env(g, t, a, peak, decay);
    o.connect(g); g.connect(p); p.connect(bus); o.start(t); o.stop(t + a + decay * 7);
  }
  function hiss(bus, t, type, f, q, peak, a, decay, f2, glide = .1, pan = 0) {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner();
    s.buffer = noise; fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + glide); fl.Q.value = q; p.pan.value = pan;
    env(g, t, a, peak, decay); s.connect(fl); fl.connect(g); g.connect(p); p.connect(bus); s.start(t, (t * 7.3) % .5); s.stop(t + a + decay * 7);
  }
  const M = musicBus, X = sfxBus;
  const kick = (t, a = .9) => osc(M, t, 'sine', 150, a, .002, .12, 42, .1);
  const clap = t => { hiss(M, t, 'bandpass', 1500, .9, .5, .002, .06); hiss(M, t + .012, 'bandpass', 1700, .9, .35, .002, .08); };
  const hat = (t, a = .12) => hiss(M, t, 'highpass', 7500, .7, a, .001, .025, null, 0, .3);
  const crash = t => hiss(M, t, 'highpass', 5000, .5, .35, .002, .6);
  const bass = (t, m, len) => { const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = hz(m);
    f.type = 'lowpass'; f.frequency.value = 520; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .01); g.gain.setTargetAtTime(0, t + len * .7, .05);
    o.connect(f); f.connect(g); g.connect(M); o.start(t); o.stop(t + len + .4); };
  const pluck = (t, m, a = .12, pan = 0) => { osc(M, t, 'triangle', hz(m), a, .003, .18, null, 0, pan); osc(M, t, 'sine', hz(m + 12), a * .3, .003, .08, null, 0, pan); };
  const pad = (t, notes, len, a = .045) => notes.forEach((m, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = hz(m); o.detune.value = (i - 1) * 6;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + .4); g.gain.setValueAtTime(a, t + len - .3); g.gain.linearRampToValueAtTime(0, t + len + .2); o.connect(g); g.connect(M); o.start(t); o.stop(t + len + .3); });
  // harmony: Am F C G, one chord per bar
  const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  for (let bar = 0; bar < 15; bar++) {
    const sec = SECTIONS.find(([a, e]) => bar >= a && bar < e); if (!sec) continue; const L = sec[2], t0 = T0 + bar * 4 * BEAT, ch = CH[bar % 4];
    if (L.includes('pad')) pad(t0, ch.map(m => m + 12), 4 * BEAT);
    if (L.includes('padSoft')) pad(t0, ch.map(m => m + 12), 4 * BEAT, .035);
    for (let s = 0; s < 16; s++) { const t = t0 + s * BEAT / 4, onBeat = s % 4 === 0, beat = s / 4;
      if (L.includes('kick4') && onBeat) kick(t); if (L.includes('kick2') && (s === 0 || s === 8)) kick(t, bar === 2 && s === 0 ? .35 : .6); // first kick eases in
      if (L.includes('clap') && (s === 4 || s === 12)) clap(t);
      if (L.includes('hat8') && s % 2 === 0 && !onBeat) hat(t); if (L.includes('hat16') && !onBeat) hat(t, s % 2 ? .07 : .12);
      if (L.includes('bassHalf') && (s === 0 || s === 8)) bass(t, ch[0] - 24, 2 * BEAT);
      if (L.includes('bass8') && s % 2 === 0) bass(t, ch[0] - 24 + (s % 8 === 6 ? 12 : 0), BEAT / 2);
      if (L.includes('lead')) pluck(t, [ch[0], ch[1], ch[2], ch[1] + 12][s % 4] + 12, .07, s % 2 ? .3 : -.3);
      if (L.includes('pluck') && s % 4 === 0) pluck(t, [ch[2], ch[1], ch[0], ch[1]][beat] + 12, .1);
    }
    if (bar === 9) crash(t0);
  }
  // sound effects, one per action
  const fx = {
    click: t => hiss(X, t, 'highpass', 3000, .7, .09, .001, .012), clack: t => { hiss(X, t, 'bandpass', 2200, 1, .25, .001, .03); osc(X, t, 'sine', 120, .25, .002, .05); },
    switch: t => hiss(X, t, 'bandpass', 3000, 2, .2, .001, .015),
    whooshIn: t => hiss(X, t, 'bandpass', 300, 1.2, .3, .35, .25, 3500, .45), whooshOut: t => hiss(X, t, 'bandpass', 3500, 1.2, .25, .3, .25, 300, .45),
    whoosh: t => hiss(X, t, 'bandpass', 500, 1, .22, .15, .15, 2500, .3),
    boing: t => { osc(X, t, 'sine', 520, .3, .005, .18, 180, .25); osc(X, t + .02, 'sine', 260, .15, .005, .12); },
    clank: t => { osc(X, t, 'triangle', 880, .22, .001, .06); osc(X, t, 'triangle', 1318, .12, .001, .05); hiss(X, t, 'bandpass', 4000, 3, .15, .001, .02); },
    ding: t => { osc(X, t, 'sine', 1568, .22, .002, .35); osc(X, t, 'sine', 2349, .08, .002, .2); },
    pop: t => osc(X, t, 'sine', 500, .28, .002, .06, 900, .05),
    tick: t => { hiss(X, t, 'bandpass', 2600, 4, .22, .001, .02); osc(X, t, 'triangle', 620, .12, .001, .03, 300, .04); }, popLow: (t, i) => osc(X, t, 'sine', 220 + i * 40, .3, .002, .08, 420 + i * 60, .06, i % 2 ? .4 : -.4),
    swish: t => hiss(X, t, 'bandpass', 1200, 2, .18, .03, .08, 2500, .12), thud: t => { osc(X, t, 'sine', 110, .5, .002, .12, 40, .12); hiss(X, t, 'lowpass', 400, 1, .2, .002, .06); },
    clonk: t => { osc(X, t, 'triangle', 330, .25, .001, .07); osc(X, t, 'triangle', 495, .12, .001, .05); },
    creak: t => osc(X, t, 'sawtooth', 90, .05, .02, .12, 70, .2),
    blip: (t, i) => osc(X, t, 'square', 880 + i * 110, .06, .002, .04, null, 0, (i - 2.5) * .15),
    zip: (t, i) => osc(X, t, 'sawtooth', 200 + i * 45, .06, .004, .08, 700 + i * 90, .12, (i % 2 ? .3 : -.3)),
    flag: t => { hiss(X, t, 'bandpass', 1800, 1.5, .2, .01, .06); osc(X, t + .05, 'sine', 1319, .2, .002, .3); osc(X, t + .12, 'sine', 1760, .2, .002, .4); },
    alarm: t => { osc(X, t, 'square', 1760, .07, .002, .05); osc(X, t + .12, 'square', 1760, .07, .002, .05); },
    step: t => { osc(X, t, 'sine', 140, .12, .002, .04, 90, .04); hiss(X, t, 'lowpass', 800, 1, .05, .002, .02); },
    notify: t => { osc(X, t, 'sine', 1319, .25, .002, .25); osc(X, t + .1, 'sine', 1976, .22, .002, .35); },
    drip: t => osc(X, t, 'sine', 1400, .18, .002, .08, 700, .08),
  };
  for (const [t, name, arg] of SFX) fx[name](T0 + t, arg);
  master.gain.setValueAtTime(.9, T0 + dur - 1); master.gain.linearRampToValueAtTime(0, T0 + dur);
}

function draw(frame) {
  const t = frame / FPS; BOIL = Math.floor(frame / 4); LAYOUT = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  render(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .6; ctx.drawImage(paper, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  window.LAYOUT = LAYOUT;
  const f = prog(t, DUR - .6, DUR); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}
window.draw = draw; window.FRAMES = FRAMES; window.FPS = FPS; window.CUES = CUTS;
window.SCORE = ac => buildGroove(ac, { dur: DUR });
if (!new URLSearchParams(location.search).has('render')) {
  let start = performance.now();
  const loop = () => { draw(Math.floor((performance.now() - start) / 1000 * FPS) % FRAMES); requestAnimationFrame(loop); };
  loop();
  addEventListener('click', () => { if (!window.SCORE) return; const ac = new AudioContext(); window.SCORE(ac); start = performance.now() + 50; }, { once: true });
}
</script></body></html>
